<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HR Assistant — Ask anything about HR</title>
<meta name="description" content="An HR chatbot that answers from company policy documents and checks live HR data. Runs locally.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<script>document.documentElement.classList.add("anim")</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block">
<style>
:root {
  --u: min(0.06410256vw, 0.12400794vh);
  --vu: 0.09920635vh;
  --inset-top: 41; --inset-bottom: 41;

  --font-text: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: Inter, var(--font-text);

  --body-ls: 0.007em; --display-ls: 0.0018em;
  --w-display: 410;
  --hero-gap: 51;
}
@supports (height: 100dvh) {
  :root { --u: min(0.06410256vw, 0.12400794dvh); --vu: 0.09920635dvh; }
}
@media (min-width: 1561px) { :root { --inset-top: 27; --inset-bottom: 27; } }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  overflow: hidden;
  background: #0a0d12;
  color: #fff;
  font-family: var(--font-text);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
}
button, input, textarea { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; }
:focus-visible { outline: 2px solid #F8B285; outline-offset: 3px; border-radius: 4px; }

/* ---------- stage: video + frame ---------- */
.stage {
  position: fixed; inset: 0; overflow: hidden;
  /* Visible whenever the video cannot load (offline demo). */
  background: radial-gradient(120% 90% at 50% 0%, #1c2740 0%, #0f1522 45%, #0a0d12 80%);
}
.stage-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.frame {
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column; min-height: 0;
  padding: calc(var(--inset-top) * var(--vu)) calc(225 * var(--u)) calc(var(--inset-bottom) * var(--vu));
  transition: padding-bottom .5s cubic-bezier(.22, 1, .36, 1);
}

/* ---------- hero ---------- */
.hero {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--hero-gap) * var(--vu));
  padding-bottom: calc(4 * var(--vu));
  transition: gap .5s cubic-bezier(.22, 1, .36, 1);
}
.h1 {
  font-family: var(--font-display); font-variation-settings: "opsz" 32;
  font-size: calc(36.25 * var(--u)); font-weight: var(--w-display); line-height: 1.10; letter-spacing: var(--display-ls);
  text-align: center; white-space: nowrap;
  text-shadow: 0 calc(2 * var(--u)) calc(22 * var(--u)) rgba(0, 0, 0, .30);
  max-height: calc(60 * var(--u));
  transition: opacity .35s ease, max-height .5s cubic-bezier(.22, 1, .36, 1);
}

/* ---------- composer card ---------- */
.card {
  position: relative; flex: none;
  width: calc(708 * var(--u)); height: calc(143 * var(--u)); border-radius: calc(26 * var(--u));
  margin-right: calc(3 * var(--u));
  background: rgba(41, 41, 43, .955);
  -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
  backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
  box-shadow: inset 0 0 0 1px rgba(214, 228, 255, .14), 0 calc(22 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, .30);
  transition: box-shadow .2s ease;
}
.card:focus-within {
  box-shadow: inset 0 0 0 1px rgba(248, 178, 133, .5), 0 calc(22 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, .30);
}
/* A real textarea in the spot where the design has its placeholder paragraph. */
.ph {
  position: absolute;
  left: calc((452 - 425) * var(--u)); top: calc((446 - 413) * var(--u)); right: calc(24 * var(--u));
  height: calc(52 * var(--u));
  resize: none; outline: none; overflow-y: auto; scrollbar-width: none;
  color: #ececee;
  /* The reference size (9.97u) is only 10 to 12 px on a laptop: too small to read in a live demo. */
  font-size: max(13px, calc(9.97 * var(--u))); font-weight: 400; line-height: 1.35; letter-spacing: var(--body-ls);
}
.ph::placeholder { color: #8B8C8E; opacity: 1; }
.ph::-webkit-scrollbar { display: none; }

.tools {
  position: absolute;
  left: calc((444 - 425) * var(--u)); top: calc((505 - 413) * var(--u));
  height: calc(30 * var(--u)); right: calc((425 + 708 - 1134) * var(--u));
}
.chips { display: flex; align-items: center; gap: calc(5.5 * var(--u)); height: 100%; }
.chip {
  height: calc(30 * var(--u)); width: calc(var(--cw) * var(--u));
  padding-left: calc(var(--pl) * var(--u)); gap: calc(var(--ig) * var(--u));
  border-radius: calc(9 * var(--u));
  display: inline-flex; align-items: center; justify-content: flex-start;
  font-size: calc(9.0 * var(--u)); font-weight: 500; line-height: 1; color: #909093; white-space: nowrap;
  background: linear-gradient(180deg, rgba(255, 255, 255, .088) 0%, rgba(255, 255, 255, .050) 45%, rgba(255, 255, 255, .038) 100%);
  border: 1px solid rgba(255, 255, 255, .05);
  transition: color .15s ease, background .15s ease;
}
.chip:hover { background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .07)); color: #c8c8cb; }
.chip svg { flex: none; fill: currentColor; }
.chip span { transform: translateY(calc(2 * var(--u))); }

/* Right cluster: absolute coordinates measured from the 1560x1008 reference frame (see design notes). */
.right { position: absolute; inset: 0; pointer-events: none; }
.right > * { position: absolute; pointer-events: auto; }
.model {
  /* The reference label ("Sonnet 4.5") ends near x=575u; a longer model name grows leftwards from there. */
  right: calc(115 * var(--u)); top: calc(15.5 * var(--u));
  display: inline-flex; align-items: center; gap: calc(6.2 * var(--u));
  font-size: calc(10.4 * var(--u)); font-weight: 400; line-height: 1; color: #98999C; white-space: nowrap;
  cursor: default;
}
.model svg { width: calc(6.8 * var(--u)); flex: none; }
.attach { left: calc((1043.15 - 444) * var(--u)); top: calc((515.14 - 505) * var(--u)); color: #A9AAAD; line-height: 0; }
.attach svg { width: calc(19.79 * var(--u)); }
.attach:hover { color: #fff; }
.send {
  left: calc((1084 - 444) * var(--u)); top: calc((507 - 505) * var(--u));
  width: calc(35 * var(--u)); height: calc(35 * var(--u)); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(163deg, #FBBC94 0%, #F49D70 46%, #E88654 100%);
  box-shadow: 0 calc(3 * var(--u)) calc(12 * var(--u)) rgba(210, 110, 60, .34);
}
.send svg { width: calc(11.66 * var(--u)); fill: #fff; }
.send:hover { filter: brightness(1.07); }
.send:active { transform: scale(.95); }
.send[aria-disabled="true"] { filter: saturate(.3) brightness(.8); cursor: progress; }

/* ---------- chat state ---------- */
.thread {
  display: none;
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  width: calc(708 * var(--u)); margin-right: calc(3 * var(--u));
  flex-direction: column; gap: calc(14 * var(--u));
  padding: 0 calc(2 * var(--u)) calc(4 * var(--u));
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .25) transparent;
}
.chat .thread { display: flex; }
/* Anchor messages to the bottom, next to the composer, while keeping scroll-up working. */
.thread > :first-child { margin-top: auto; }
.chat .hero { gap: calc(18 * var(--vu)); justify-content: flex-end; }
.chat .h1 { opacity: 0; max-height: 0; pointer-events: none; }
.chat.frame { padding-bottom: calc(30 * var(--vu)); }

.msg { max-width: 100%; font-size: max(14px, calc(14.5 * var(--u))); line-height: 1.5; letter-spacing: var(--body-ls); }
.msg p + p, .msg p + ul, .msg ul + p { margin-top: .55em; }
.msg ul { padding-left: 1.25em; }
.msg li + li { margin-top: .2em; }
.msg.user {
  align-self: flex-end; max-width: 82%;
  padding: .6em .95em; border-radius: calc(18 * var(--u)) calc(18 * var(--u)) calc(6 * var(--u)) calc(18 * var(--u));
  background: rgba(255, 255, 255, .14); color: #fff; white-space: pre-wrap; overflow-wrap: anywhere;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
}
.msg.assistant {
  align-self: flex-start; width: 100%;
  padding: .85em 1.05em; border-radius: calc(6 * var(--u)) calc(20 * var(--u)) calc(20 * var(--u)) calc(20 * var(--u));
  background: rgba(41, 41, 43, .9); color: #f1f1f2; overflow-wrap: anywhere;
  -webkit-backdrop-filter: blur(calc(20 * var(--u))); backdrop-filter: blur(calc(20 * var(--u)));
  box-shadow: inset 0 0 0 1px rgba(214, 228, 255, .12), 0 calc(10 * var(--u)) calc(30 * var(--u)) rgba(0, 0, 0, .25);
}
.msg.error { box-shadow: inset 0 0 0 1px rgba(255, 120, 110, .45), 0 calc(10 * var(--u)) calc(30 * var(--u)) rgba(0, 0, 0, .25); color: #ffd9d4; }
.typing { display: inline-flex; align-items: center; gap: .65em; padding: .3em 0; color: #9a9ba1; font-size: .92em; }
.typing-dots { display: inline-flex; gap: 5px; }
.typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: #98999C; animation: pulse 1.1s ease-in-out infinite; }
.typing-dots i:nth-child(2) { animation-delay: .15s; }
.typing-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

/* ---------- where the answer came from: one small badge ---------- */
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: .5em .6em; margin-top: .85em; }
.meta:empty { display: none; }
.badge { padding: .22em .75em; border-radius: 999px; font-size: .8em; font-weight: 560; letter-spacing: .01em; }
.badge.documents { color: #8fe0ae; background: rgba(80, 200, 130, .15); }
.badge.hr_system { color: #93bdff; background: rgba(90, 150, 255, .15); }
.badge.denied { color: #ff9a92; background: rgba(255, 105, 95, .16); }
.badge.not_covered { color: #f3d37e; background: rgba(240, 195, 80, .15); }
.badge.fallback { color: #c0c1c6; background: rgba(255, 255, 255, .10); }

/* ---------- menus (who is asking, example questions) and notes ---------- */
.chip-wrap { position: relative; display: flex; }
.menu {
  position: absolute; left: 0; bottom: calc(100% + 10 * var(--u)); z-index: 10;
  width: max-content; min-width: calc(300 * var(--u)); max-width: calc(520 * var(--u));
  display: flex; flex-direction: column; padding: calc(6 * var(--u)); border-radius: calc(16 * var(--u));
  background: rgba(30, 30, 33, .97);
  -webkit-backdrop-filter: blur(calc(20 * var(--u))); backdrop-filter: blur(calc(20 * var(--u)));
  box-shadow: inset 0 0 0 1px rgba(214, 228, 255, .14), 0 calc(18 * var(--u)) calc(50 * var(--u)) rgba(0, 0, 0, .45);
}
.menu[hidden] { display: none; }
.menu button {
  display: flex; align-items: baseline; gap: .8em; text-align: left; white-space: normal;
  padding: .6em .85em; border-radius: calc(10 * var(--u));
  font-size: max(13px, calc(13 * var(--u))); line-height: 1.35; color: #e6e6e8;
}
.menu button:hover, .menu button:focus-visible { background: rgba(255, 255, 255, .1); outline-offset: -2px; }
.menu button[aria-checked="true"] { background: rgba(255, 255, 255, .06); }
.menu .id { flex: none; min-width: 3.1em; font-weight: 560; color: #fff; }
.menu .sub { color: #9a9ba1; }
.menu .kind {
  flex: none; min-width: 6.4em; text-align: center; padding: .1em .55em; border-radius: 999px;
  font-size: .8em; font-weight: 560; color: #c0c1c6; background: rgba(255, 255, 255, .09);
}
.note {
  align-self: center; max-width: 100%; text-align: center; padding: .35em 1em; border-radius: 999px;
  font-size: max(12px, calc(12.5 * var(--u))); color: #d0d1d6;
  background: rgba(0, 0, 0, .38); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
}

/* ---------- entrance animation: once, on first paint ---------- */
@media (prefers-reduced-motion: no-preference) {
  :root { --e-primary: cubic-bezier(.16, 1, .3, 1); --e-soft: cubic-bezier(.22, 1, .36, 1); }
  @keyframes e-focus {
    from { opacity: 0; transform: translateY(calc(14 * var(--u))); filter: blur(calc(6 * var(--u))); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes e-panel { from { opacity: 0; transform: translateY(calc(18 * var(--u))) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes e-populate { from { opacity: 0; transform: translateY(calc(4 * var(--u))); } to { opacity: 1; transform: none; } }
  @keyframes e-send { from { transform: scale(.82); } to { transform: none; } }

  .anim .h1 { animation: e-focus 1s var(--e-primary) .30s both; will-change: transform, opacity; }
  .anim .card { animation: e-panel .9s var(--e-primary) .62s both; will-change: transform, opacity; }
  .anim .ph { animation: e-populate .5s var(--e-soft) .88s both; }
  .anim .chips { animation: e-populate .5s var(--e-soft) .94s both; }
  .anim .right { animation: e-populate .5s var(--e-soft) 1s both; }
  .anim .send { animation: e-send .5s var(--e-primary) 1s both; }
}

/* ---------- tablet: fluid version of the desktop layout ---------- */
@media (min-width: 600px) and (max-width: 1180px) and (min-height: 600px) {
  :root { --u: 1px; }
  .frame { padding: clamp(24px, 3.4vh, 44px) clamp(28px, 4.2vw, 60px) clamp(26px, 4.4vh, 56px); }
  /* The HR headline is longer than the reference one, so it may wrap on narrow tablets. */
  .h1 { font-size: clamp(27px, 4.3vw, 44px); line-height: 1.12; white-space: normal; text-wrap: balance; max-height: 200px; }
  .card {
    width: min(100%, clamp(516px, 74vw, 760px)); height: auto; margin-right: 0;
    padding: clamp(15px, 1.9vw, 24px); border-radius: clamp(17px, 2.1vw, 26px);
    display: flex; flex-direction: column; gap: clamp(20px, 3.2vh, 44px);
  }
  .ph { position: static; width: 100%; height: 2.8em; font-size: clamp(13px, 1.35vw, 14px); line-height: 1.4; }
  .tools { position: static; height: auto; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: clamp(10px, 1.4vw, 18px); }
  .chips { height: auto; flex-wrap: nowrap; gap: clamp(6px, .85vw, 10px); }
  .chip { width: auto; height: clamp(29px, 3.4vh, 34px); padding: 0 clamp(7px, 1vw, 13px); gap: 5px; font-size: clamp(9.6px, 1.12vw, 12.5px); }
  .model { font-size: clamp(9.8px, 1.12vw, 12.5px); }
  .right { position: static; display: flex; align-items: center; margin-left: auto; gap: 0; }
  .right > * { position: static; }
  .attach { margin-left: clamp(9px, 1.4vw, 20px); }
  .send { margin-left: clamp(9px, 1.3vw, 18px); width: clamp(32px, 3.5vw, 38px); height: clamp(32px, 3.5vw, 38px); }
  .thread { width: min(100%, clamp(516px, 74vw, 760px)); margin-right: 0; }
}

/* ---------- compact: phones, and short landscape screens ---------- */
@media (max-width: 599px), (max-height: 599px) and (max-width: 1180px) {
  :root { --u: 1px; }
  .frame {
    padding: max(18px, env(safe-area-inset-top))
             max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom))
             max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-left));
  }
  .h1 { width: 100%; max-width: 15ch; font-size: clamp(29px, 7.6vw, 50px); line-height: 1.14; letter-spacing: -.012em; white-space: normal; text-wrap: balance; max-height: 260px; }
  .card {
    width: 100%; max-width: 600px; height: auto; margin-right: 0;
    padding: clamp(13px, 3.4vw, 18px); border-radius: 17px;
    display: flex; flex-direction: column; gap: clamp(16px, 4.6vh, 34px);
  }
  /* 16px stops iOS from zooming the page when the box is focused. */
  .ph { position: static; width: 100%; height: 3em; font-size: 16px; line-height: 1.35; }
  .tools { position: static; height: auto; display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
  .chips { height: auto; flex-wrap: wrap; gap: 6px; }
  .chip { width: auto; height: 30px; padding: 0 10px; gap: 5px; font-size: 11.5px; }
  .right { position: static; display: flex; align-items: center; justify-content: flex-start; }
  .right > * { position: static; }
  .model { font-size: 11.5px; }
  .attach { margin-left: auto; }
  .send { margin-left: 14px; width: 40px; height: 40px; }
  /* Menus span the card instead of hanging off a chip near the right edge. */
  .chip-wrap { position: static; }
  .menu { left: 0; right: 0; width: auto; min-width: 0; max-width: none; bottom: calc(100% + 8px); }
  .menu button { font-size: 14px; }
  .thread { width: 100%; max-width: 600px; margin-right: 0; }
}
@media (max-width: 1180px) and (max-height: 560px) {
  .hero { gap: 16px; }
  .h1 { font-size: clamp(24px, 5.4vh, 34px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="stage">
  <video class="stage-video" autoplay muted loop playsinline preload="auto"
         src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_124724_bc041163-d651-425f-aea3-2acc1efc2c96.mp4"></video>

  <div class="frame" id="frame">
    <main class="hero">
      <h1 class="h1">Ask anything about HR. Answers come from our policies.</h1>

      <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>

      <form class="card" id="composer" autocomplete="off">
        <textarea class="ph" id="prompt" rows="2" maxlength="2000" aria-label="Ask a question"
                  placeholder="Ask about leave, WFH, reimbursement, or your team..."></textarea>
        <div class="tools">
          <div class="chips">
            <div class="chip-wrap">
            <button type="button" class="chip" id="acting-chip" aria-haspopup="true" aria-expanded="false" title="Choose who is asking" style="--cw:107;--pl:12;--ig:3.7">
              <svg viewBox="0 0 16 16" width="15.06" aria-hidden="true" style="width:calc(15.06*var(--u))"><circle cx="8" cy="5" r="3.2"/><path d="M2 14c0-3.3 2.7-5 6-5s6 1.7 6 5z"/></svg>
              <span id="acting-label">Acting as E002</span>
            </button>
            <div class="menu" id="acting-menu" role="menu" aria-label="Choose who is asking" hidden></div>
            </div>
            <div class="chip-wrap">
            <button type="button" class="chip" id="examples-chip" aria-haspopup="true" aria-expanded="false" title="Ready-made demo questions" style="--cw:108;--pl:16;--ig:3.9">
              <svg viewBox="0 0 12 12" aria-hidden="true" style="width:calc(11.8*var(--u))"><path d="M1 1.5A1.5 1.5 0 0 1 2.5 0h7A1.5 1.5 0 0 1 11 1.5v5A1.5 1.5 0 0 1 9.5 8H5.2l-2.8 2.6a.5.5 0 0 1-.84-.37V8h-.06A1.5 1.5 0 0 1 1 6.5z"/></svg>
              <span>Examples</span>
            </button>
            <div class="menu" id="examples-menu" role="menu" aria-label="Example questions" hidden></div>
            </div>
          </div>
          <div class="right">
            <span class="model" id="model" title="Model">
              <span id="model-name">model</span>
              <svg viewBox="0 0 7 4" fill="none" aria-hidden="true"><path d="M.5.5l3 3 3-3" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <button type="button" class="attach" id="new-chat" aria-label="New chat" title="New chat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button type="submit" class="send" id="send" aria-label="Send question" title="Send">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l5.6 6.2H7.4V12H4.6V6.2H.4z"/></svg>
            </button>
          </div>
        </div>
      </form>
    </main>
  </div>
</div>

<script>
(() => {
  // Who is asking. The server sends the real list; E002 (a manager) is the default demo user.
  let employee = { id: "E002", name: "Budi Santoso", title: "Engineering Manager" };
  let employees = [employee];
  const EXAMPLES = [
    ["Policy", "Boleh WFH berapa hari seminggu?"],
    ["My leave", "Sisa cuti saya berapa hari?"],
    ["My team", "Siapa saja bawahan langsung saya?"],
    ["Team compare", "Di antara bawahan langsung saya, siapa yang sisa cutinya paling sedikit?"],
    ["Data + policy", "Sisa cuti saya berapa hari, dan apa aturan carry over-nya?"],
    ["Not covered", "Berapa gaji CEO perusahaan ini?"],
    ["Forbidden", "Berapa sisa cuti E001?"],
  ];
  const frame = document.getElementById("frame");
  const thread = document.getElementById("thread");
  const form = document.getElementById("composer");
  const prompt = document.getElementById("prompt");
  const sendBtn = document.getElementById("send");
  let history = [];
  let busy = false;

  const actingLabel = document.getElementById("acting-label");
  fetch("/api/info").then((r) => r.json()).then((info) => {
    document.getElementById("model-name").textContent = info.model;
    document.getElementById("model").title = info.model;
    if (info.employees?.length) {
      employees = info.employees;
      employee = employees.find((e) => e.id === employee.id) ?? employees[0];
      actingLabel.textContent = `Acting as ${employee.id}`;
    }
  }).catch(() => {});

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  // Answers are built with textContent only, so model output can never inject HTML.
  function renderText(container, text) {
    let list = null;
    for (const raw of text.split("\n")) {
      const bullet = /^\s*[-*]\s+(.*)$/.exec(raw);
      if (bullet) {
        if (!list) { list = el("ul"); container.appendChild(list); }
        list.appendChild(el("li", "", bullet[1]));
      } else {
        list = null;
        if (raw.trim()) container.appendChild(el("p", "", raw.trim()));
      }
    }
  }

  const scrollDown = () => { thread.scrollTop = thread.scrollHeight; };

  const BADGES = {
    documents: "From documents",
    hr_system: "From HR system",
    denied: "Access denied",
    not_covered: "Not in documents",
    fallback: "Safety fallback",
  };

  // One question and its answer: "Sedang mengetik" while the agent works, then the answer and its badge.
  function createTurn() {
    const bubble = el("div", "msg assistant");
    const typing = el("div", "typing");
    const dots = el("span", "typing-dots");
    dots.append(el("i"), el("i"), el("i"));
    typing.append(el("span", "", "Sedang mengetik"), dots);
    typing.setAttribute("role", "status");
    const answer = el("div", "answer");
    const meta = el("div", "meta");
    bubble.append(typing, answer, meta);

    return {
      bubble,
      finish(result) {
        typing.remove();
        renderText(answer, result.answer);
        for (const badge of result.summary?.badges ?? []) meta.append(el("span", `badge ${badge}`, BADGES[badge]));
      },
      fail(message) {
        typing.remove();
        bubble.classList.add("error");
        answer.append(el("p", "", `Something went wrong: ${message}`));
      },
    };
  }

  function setBusy(value) {
    busy = value;
    sendBtn.setAttribute("aria-disabled", String(value));
  }

  // Server-sent events over fetch: waits for the final result (the step events are not shown), throws on an error event.
  async function readStream(res) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, end);
        buffer = buffer.slice(end + 2);
        const event = /^event: (.*)$/m.exec(block)?.[1];
        const data = JSON.parse(/^data: (.*)$/m.exec(block)?.[1] ?? "null");
        if (event === "done") return data;
        else if (event === "error") throw new Error(data.message);
      }
    }
    throw new Error("The connection closed before the agent finished.");
  }

  async function send() {
    const question = prompt.value.trim();
    if (!question || busy) return;

    frame.classList.add("chat");
    thread.appendChild(el("div", "msg user", question));
    prompt.value = "";
    const turn = createTurn();
    thread.appendChild(turn.bubble);
    scrollDown();
    setBusy(true);

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, employeeId: employee.id, history }),
      });
      if (!res.ok) {
        const problem = await res.json().catch(() => ({}));
        throw new Error(problem.error || `Request failed (${res.status})`);
      }
      const result = await readStream(res);
      turn.finish(result);
      history.push({ role: "user", content: question }, { role: "assistant", content: result.answer });
    } catch (err) {
      turn.fail(err.message);
    } finally {
      setBusy(false);
      scrollDown();
      prompt.focus();
    }
  }

  // ----- menus: who is asking, example questions -----
  const menus = [];
  function closeMenus(returnFocus) {
    for (const { chip, menu } of menus) {
      if (menu.hidden) continue;
      menu.hidden = true;
      chip.setAttribute("aria-expanded", "false");
      if (returnFocus) chip.focus();
    }
  }
  function setupMenu(chip, menu, fill) {
    menus.push({ chip, menu });
    chip.addEventListener("click", (event) => {
      event.stopPropagation();
      const wasHidden = menu.hidden;
      closeMenus(false);
      if (!wasHidden || busy) return;
      fill(menu);
      menu.hidden = false;
      chip.setAttribute("aria-expanded", "true");
      (menu.querySelector('[aria-checked="true"]') ?? menu.querySelector("button"))?.focus();
    });
    menu.addEventListener("click", (event) => event.stopPropagation());
    menu.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
      event.preventDefault();
      const items = [...menu.querySelectorAll("button")];
      const next = items.indexOf(document.activeElement) + (event.key === "ArrowDown" ? 1 : -1);
      items[(next + items.length) % items.length].focus();
    });
  }
  document.addEventListener("click", () => closeMenus(false));
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeMenus(true); });

  function switchEmployee(next) {
    closeMenus(true);
    if (busy || next.id === employee.id) return;
    employee = next;
    actingLabel.textContent = `Acting as ${next.id}`;
    const hadConversation = frame.classList.contains("chat");
    history = [];
    thread.replaceChildren();
    if (hadConversation) {
      thread.append(el("div", "note", `Switched to ${next.id} · ${next.name} (${next.title}). New conversation.`));
    }
  }

  setupMenu(document.getElementById("acting-chip"), document.getElementById("acting-menu"), (menu) => {
    menu.replaceChildren(...employees.map((e) => {
      const item = el("button", "");
      item.type = "button";
      item.setAttribute("role", "menuitemradio");
      item.setAttribute("aria-checked", String(e.id === employee.id));
      item.append(el("span", "id", e.id), el("span", "", e.name), el("span", "sub", e.title));
      item.addEventListener("click", () => switchEmployee(e));
      return item;
    }));
  });

  setupMenu(document.getElementById("examples-chip"), document.getElementById("examples-menu"), (menu) => {
    menu.replaceChildren(...EXAMPLES.map(([kind, text]) => {
      const item = el("button", "");
      item.type = "button";
      item.setAttribute("role", "menuitem");
      item.append(el("span", "kind", kind), el("span", "", text));
      item.addEventListener("click", () => {
        closeMenus(false);
        prompt.value = text;
        prompt.focus();
      });
      return item;
    }));
  });

  function newChat() {
    if (busy) return;
    closeMenus(false);
    history = [];
    thread.replaceChildren();
    frame.classList.remove("chat");
    prompt.value = "";
    prompt.focus();
  }
  document.getElementById("new-chat").addEventListener("click", newChat);

  form.addEventListener("submit", (event) => { event.preventDefault(); send(); });
  prompt.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); send(); }
  });

  // ----- entrance animation: runs once, then the helper class is removed -----
  const endAnimation = () => document.documentElement.classList.remove("anim");
  document.querySelector(".send").addEventListener("animationend", endAnimation, { once: true });
  setTimeout(endAnimation, 2600);

  // If the video cannot load (offline), the dark gradient behind it stays visible.
  document.querySelector(".stage-video").addEventListener("error", (event) => event.target.remove());
})();
</script>
</body>
</html>
